<!DOCTYPE html>
<html>
<head>
  <title>Test Intro Sequence</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Courier New', monospace;
      background: #000;
      color: #fff;
    }
    #container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button {
      padding: 20px 40px;
      font-size: 20px;
      background: #ff3333;
      color: #fff;
      border: none;
      cursor: pointer;
      font-family: 'Courier New', monospace;
    }
  </style>
</head>
<body>
  <div id="container">
    <button id="test-btn">TEST INTRO SEQUENCE</button>
  </div>

  <script type="module">
    import { IntroSequence } from './src/ui/IntroSequence.js';

    document.getElementById('test-btn').addEventListener('click', () => {
      console.log('Testing intro sequence...');

      IntroSequence.show(null, () => {
        console.log('✅ Intro sequence completed!');
        alert('Intro sequence finished!');
      });
    });
  </script>
</body>
</html>
